          { title: "IV. Hình phạt áp dụng với người dưới 18 tuổi", items: ["PHẠT TIỀN: chỉ áp dụng với người đủ 16 tuổi trở lên và có tài sản riêng hoặc thu nhập riêng", "CẢI TẠO KHÔNG GIAM GIỮ: thời hạn tối đa ≤ 1/2 so với người lớn (tối đa 1,5 năm)", "TÙ CÓ THỜI HẠN với người 16 → dưới 18 tuổi: tối đa 18 năm tù (thay vì 20 năm với người lớn)", "TÙ CÓ THỜI HẠN với người 14 → dưới 16 tuổi: tối đa 12 năm tù", "TUYỆT ĐỐI KHÔNG áp dụng: tù chung thân và tử hình với người dưới 18 tuổi", "Không áp dụng hình phạt bổ sung: tước một số quyền công dân, cấm cư trú, quản chế"] },
          { title: "V. Quyết định hình phạt đặc thù", items: ["Chuẩn bị phạm tội/chưa đạt: mức tối đa ≤ 1/2 khung HP áp dụng cho người dưới 18 tuổi", "Tổng hợp hình phạt nhiều tội: không vượt mức tối đa theo lứa tuổi (18 năm hoặc 12 năm)", "Tổng hợp nhiều bản án: tương tự giới hạn theo lứa tuổi tại thời điểm xét xử"] },
          { title: "VI. Giảm mức HP & Tha tù trước thời hạn", items: ["Giảm mức hình phạt: điều kiện & thời gian xét duyệt ưu đãi hơn so với người trưởng thành", "Tha tù trước thời hạn có điều kiện: chấp hành ít nhất 1/3 mức tù (người lớn cần 1/2)", "Xóa án tích: thời hạn ngắn hơn đáng kể so với người trưởng thành", "Người dưới 16 tuổi bị kết án: khi chấp hành xong bản án → CỬ NHƯ KHÔNG CÓ ÁN TÍCH"] }
        ]
      }
    ];

    const THEMES = [
      { id: "tat-ca", label: "📚 Tất cả" },
      { id: "tong-quan", label: "⚖️ Tổng quan" },
      { id: "toi-pham", label: "🔍 Tội phạm" },
      { id: "dong-pham", label: "👥 Đồng phạm" },
      { id: "hinh-phat", label: "⚡ Hình phạt" },
      { id: "nguoi-duoi-18", label: "🧒 Người < 18t" }
    ];

    // RENDER SIDEBAR
    function renderSidebar() {
      const list = document.getElementById("sidebar-list");
      list.innerHTML = CHAPTERS.map(ch => `
        <li onclick="scrollToChapter('${ch.id}')">${ch.label}</li>
      `).join('');
    }

    // RENDER TABS
    function renderTabs() {
      const tabsContainer = document.getElementById("theme-tabs");
      tabsContainer.innerHTML = THEMES.map((t, index) => `
        <div class="tab ${index === 0 ? 'on' : ''}" onclick="filterTheme('${t.id}', this)">
          ${t.label}
        </div>
      `).join('');
    }

    // RENDER CARDS (THEO CHUẨN HTML CỦA FILE CSS)
    function renderCards() {
      const grid = document.getElementById("grid-container");
      grid.innerHTML = CHAPTERS.map(ch => `
        <div class="card" id="${ch.id}" data-themes="${ch.themes.join(' ')}">
          <div class="hd" onclick="toggleCard(this)">
            <div class="num">${ch.num}</div>
            <div class="ttl">${ch.title}</div>
            <div class="tg">${ch.pages}</div>
            <div class="arr">▼</div>
          </div>
          <div class="bd">
            ${ch.sections.map(sec => `
              <div class="sec-item">
                <div class="sec-ttl">${sec.title}</div>
                <ul class="sec-list">
                  ${sec.items.map(item => `<li>${item}</li>`).join('')}
                </ul>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // TOGGLE EXPAND CARD (DÙNG CLASS .on)
    function toggleCard(hdElement) {
      const card = hdElement.parentElement;
      card.classList.toggle("on");
    }

    // LỌC THEO TAB (DÙNG CLASS .hidden CỦA CSS)
    function filterTheme(themeId, tabElement) {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("on"));
      tabElement.classList.add("on");

      document.querySelectorAll(".card").forEach(card => {
        const themes = card.getAttribute("data-themes") || "";
        if (themeId === "tat-ca" || themes.includes(themeId)) {
          card.classList.remove("hidden");
        } else {
          card.classList.add("hidden");
        }
      });
    }

    // SỰ KIỆN SIDEBAR MOBILE
    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("show");
    }

    // CUỘN ĐẾN CHƯƠNG VÀ MỞ NÓ
    function scrollToChapter(id) {
      const card = document.getElementById(id);
      if (card) {
        card.classList.remove("hidden");
        card.classList.add("on"); // Tự động mở card khi bấm sidebar
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        
        // Đóng sidebar nếu đang ở giao diện mobile
        document.getElementById("sidebar").classList.remove("show");
      }
    }

    // KHỞI TẠO TẤT CẢ GIAO DIỆN
    renderSidebar();
    renderTabs();
    renderCards();
  </script>
</body>
</html>
