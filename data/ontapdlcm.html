<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mindmap: Lịch sử ĐCSVN - An ninh chính trị</title>
<style>
  :root{
    --navy-950:#050b16;
    --navy-900:#0a1526;
    --navy-800:#0f1e35;
    --navy-700:#152947;
    --navy-600:#1c3457;
    --gold:#d4af37;
    --gold-soft:#f0d878;
    --red:#c0392b;
    --red-soft:#e0574a;
    --text:#e8edf5;
    --text-dim:#9aabc4;
    --line:#22334f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', 'Roboto', Arial, sans-serif;
    background:
      radial-gradient(circle at 15% 0%, rgba(212,175,55,0.08), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(192,57,43,0.10), transparent 45%),
      var(--navy-950);
    color:var(--text);
    min-height:100vh;
    padding-bottom:60px;
  }

  header{
    position:relative;
    padding:38px 20px 30px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, rgba(21,41,71,0.6), transparent);
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, var(--gold) 0%, var(--gold) 33%, var(--red) 33%, var(--red) 66%, var(--gold) 66%);
    opacity:0.05;
  }
  .eyebrow{
    letter-spacing:4px;
    font-size:11px;
    color:var(--gold-soft);
    text-transform:uppercase;
    margin-bottom:10px;
    font-weight:600;
  }
  h1{
    margin:0;
    font-size:clamp(22px, 4vw, 32px);
    font-weight:800;
    color:#fff;
    letter-spacing:0.5px;
  }
  h1 span{color:var(--gold-soft);}
  .subtitle{
    margin-top:10px;
    color:var(--text-dim);
    font-size:14px;
    max-width:640px;
    margin-left:auto;margin-right:auto;
  }

  .controls{
    max-width:900px;
    margin:22px auto 0;
    padding:0 16px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .ctrl-btn{
    background:var(--navy-800);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 16px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .ctrl-btn:hover{
    border-color:var(--gold);
    color:var(--gold-soft);
  }

  main{
    max-width:900px;
    margin:30px auto;
    padding:0 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card{
    background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 4px 18px rgba(0,0,0,0.35);
    transition:border-color .25s ease, transform .2s ease;
  }
  .card:hover{transform:translateY(-1px);}

  .card-head{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    cursor:pointer;
    user-select:none;
  }
  .tab{
    flex-shrink:0;
    width:6px;
    align-self:stretch;
    border-radius:4px;
    min-height:30px;
  }
  .num{
    flex-shrink:0;
    width:34px;height:34px;
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;
    font-size:13px;
    color:var(--navy-950);
  }
  .head-text{flex:1;}
  .head-title{
    font-weight:700;
    font-size:15px;
    line-height:1.4;
    color:var(--text);
  }
  .head-tag{
    font-size:11px;
    color:var(--gold-soft);
    margin-top:3px;
    letter-spacing:0.5px;
    text-transform:uppercase;
  }
  .chevron{
    flex-shrink:0;
    width:22px;height:22px;
    color:var(--text-dim);
    transition:transform .3s ease;
  }
  .card.open .chevron{transform:rotate(180deg);}

  .card-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .4s ease;
  }
  .card-body-inner{
    padding:0 18px 20px 62px;
    border-top:1px dashed var(--line);
    padding-top:16px;
  }

  .q-block{
    font-size:13px;
    color:var(--text-dim);
    background:rgba(255,255,255,0.03);
    border-left:3px solid var(--gold);
    padding:10px 14px;
    border-radius:6px;
    margin-bottom:14px;
    line-height:1.6;
    font-style:italic;
  }

  .branch{
    margin-bottom:10px;
    padding-left:16px;
    border-left:2px solid var(--line);
    position:relative;
  }
  .branch::before{
    content:"";
    position:absolute;
    left:-5px; top:8px;
    width:8px;height:8px;
    border-radius:50%;
  }
  .branch-title{
    font-weight:700;
    font-size:13.5px;
    margin-bottom:4px;
    color:var(--gold-soft);
  }
  .branch-text{
    font-size:14px;
    line-height:1.65;
    color:var(--text);
  }
  .branch-text b{color:#fff;}

  .stage-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .stage{
    background:rgba(255,255,255,0.025);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 14px;
  }
  .stage-name{
    font-weight:700;
    font-size:13px;
    color:var(--red-soft);
    margin-bottom:3px;
  }
  .stage-desc{
    font-size:13.5px;
    color:var(--text);
    line-height:1.55;
  }

  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:12px;
    margin-top:40px;
    letter-spacing:0.5px;
  }

  @media(max-width:480px){
    .card-body-inner{padding-left:18px;}
    .num{width:28px;height:28px;font-size:11px;}
  }
</style>
</head>

const container = document.getElementById('cards');

data.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card';

  let bodyContent = '';
  if(item.q){
    bodyContent += `<div class="q-block">${item.q}</div>`;
  }
  if(item.branches){
    bodyContent += item.branches.map(b => `
      <div class="branch" style="border-left-color:${item.color}44;">
        <div class="branch-title" style="color:${item.color === GOLD ? GOLDSOFT : '#e0574a'};">${b.t}</div>
        <div class="branch-text">${b.d}</div>
      </div>
    `).join('');
  }
  if(item.stages){
    bodyContent += `<div class="stage-list">` + item.stages.map(s => `
      <div class="stage">
        <div class="stage-name">${s.n}</div>
        <div class="stage-desc">${s.d}</div>
      </div>
    `).join('') + `</div>`;
  }

  card.innerHTML = `
    <div class="card-head" onclick="this.parentElement.classList.toggle('open'); syncHeight(this.parentElement);">
      <div class="tab" style="background:${item.color};"></div>
      <div class="num" style="background:${item.color};">${i+1}</div>
      <div class="head-text">
        <div class="head-title">${item.title}</div>
        <div class="head-tag">${item.tag}</div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </div>
    <div class="card-body">
      <div class="card-body-inner">${bodyContent}</div>
    </div>
  `;
  container.appendChild(card);
});

function syncHeight(card){
  const body = card.querySelector('.card-body');
  if(card.classList.contains('open')){
    body.style.maxHeight = body.scrollHeight + 'px';
  } else {
    body.style.maxHeight = '0px';
  }
}

function toggleAll(open){
  document.querySelectorAll('.card').forEach(card => {
    if(open) card.classList.add('open'); else card.classList.remove('open');
    syncHeight(card);
  });
}
</script>
